name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-recommended texlive-fonts-recommended texlive-pictures lmodern

      - name: Set up and build Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"

      - name: Build documents and check principal theorem axioms
        run: ./scripts/check.sh

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: research-pdfs
          path: output/pdf/*.pdf
          if-no-files-found: error
